name: Deploy portfolio to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: portfolio-korota-db
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || {
            echo "Missing GitHub secret: CLOUDFLARE_D1_DATABASE_ID" >&2
            exit 1
          }
          test "$CLOUDFLARE_D1_DATABASE_ID" != "00000000-0000-4000-8000-000000000000" || {
            echo "CLOUDFLARE_D1_DATABASE_ID still contains the example value" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
